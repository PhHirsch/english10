<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Night at the Museum · The Hirsch Games</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:radial-gradient(ellipse at 50% 0%,#2a2236 0%,#0c0b10 70%);--panel:#1b1722;--txt:#efe9f6;--muted:#a79bbb;--line:#3d3450;--btn:#241e2e;--accent:#e8b84a;--accentTxt:#2a1e00;--accent2:#f3d68a;--bubble:#262030;--input:#120f18;--ok:#6fe39a;--bad:#ffb03a}
  .hall{position:relative;height:180px;overflow:hidden;border-radius:14px 14px 0 0;background:linear-gradient(#0d0b12,#1d1826 70%,#2a2232)}
  .hall .beam{position:absolute;top:0;bottom:0;width:240px;background:radial-gradient(ellipse at 50% 60%,rgba(255,230,150,.35),transparent 65%);transition:left .8s,opacity .5s}
  .hall .rooms{position:absolute;left:4%;right:4%;bottom:34px;display:flex;justify-content:space-between}
  .hall .rm{width:10%;height:70px;border-radius:30px 30px 4px 4px;background:#2d2638;border:2px solid #4a3f5a;display:grid;place-items:center;font-size:24px;opacity:.5}
  .hall .rm.ok{opacity:1;border-color:#e8b84a;background:#3a3020}
  .hall .rm.now{opacity:1;border-color:#fff;box-shadow:0 0 16px #e8b84a}
  .hall .me{position:absolute;bottom:108px;width:42px;height:42px;border-radius:50%;overflow:hidden;border:3px solid #e8b84a;background:#fff;transition:left .8s}
  .hud{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-family:Menlo,Consolas,monospace;font-size:14px;color:#f3d68a;background:#0d0b12;border-top:1px solid #3d3450}
  .bat{display:flex;align-items:center;gap:6px}.bat .b{width:110px;height:12px;border-radius:6px;background:#000;border:1px solid #6a5a7a;overflow:hidden}.bat .b i{display:block;height:100%}
  .code{display:flex;gap:6px}.code span{width:30px;height:38px;border-radius:6px;border:2px solid #e8b84a;display:grid;place-items:center;font-size:22px;font-weight:800;color:#e8b84a;background:#000}
  .read{background:#efe3c8;color:#3a2c18;border-radius:10px;padding:12px 16px;margin:10px 0;font-size:19px;line-height:1.6}
  .read .h{font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
</style>
</head>
<body>
<main id="app"></main>
<script src="game.js?v=13"></script>
<script src="juego.js?v=2"></script>
<script src="ifhelp.js?v=1"></script>
<script>
const F = IFH.F, A = {face:"🤖", name:"ARGUS"}, ME = {av:true, name:"You"};
const SIGN = `<div class="read"><div class="h">Museum rules</div>If you <u>touch</u> the paintings, the alarm <u>will ring</u>.<br>If you <u>run</u>, you <u>will break</u> something.<br>If a door <u>is</u> locked, ARGUS <u>will help</u> you.<br>Visitors <u>won't get</u> in if they <u>don't have</u> a ticket.</div>`;
const DIARY = `<div class="read"><div class="h">Lady Ashworth's diary · London, 1878</div>If I <u>were</u> a man, I <u>would study</u> at Oxford University.<br>If I <u>had</u> more money, I <u>would build</u> a museum for everyone.<br>If my father <u>listened</u> to me, he <u>would let</u> me travel to Egypt.<br>I <u>wouldn't be</u> so lonely if I <u>had</u> a sister.</div>`;
const Q = (q, opts, why, extra) => Object.assign({ t: "choice", who: A, q: q, opts: opts, a: opts[0], after: why, hint: "Look at the sentences in the box again. – Schau dir die Sätze im Kasten noch einmal an." }, extra || {});
const D = (q, opts, hint) => ({ t: "choice", noType: true, task: "Which combination opens the lock?", taskDe: "Welche Kombination öffnet das Schloss?", q: q, opts: opts, a: opts[0], hint: hint });
const SIT = (sit, ok, no, why, hint) => ({ t: "choice", noType: true, task: "Choose the sentence that fits the situation.", taskDe: "Möglich (Typ I) oder unwirklich (Typ II)?", q: `<span class="small">SITUATION:</span> ${sit}`, opts: [ok, no], a: ok, after: why, hint: hint });
const ER = (words, bad, fix, opts, hint) => ({ t: "error", task: "Tap the wrong word and correct it.", taskDe: "Tippe das falsche Wort an und verbessere es.", words: words, bad: bad, fix: fix, opts: opts, hint: hint });

JUEGO.start({
  id: "if-museum", key: "e10-if-museum", icon: "🏛️", topic: "If clauses (type I + II)", title: "Night at the Museum",
  intro: `<p>Your class is visiting the City History Museum. You want to take one more photo in the storeroom – and you forget the time. When you come out, it's <b>9 pm</b>. The museum is closed, the lights are off, and every door is locked. Your phone has no signal and only a little battery left.</p>
    <p>Suddenly a voice speaks from the loudspeakers: the security computer <b>ARGUS</b>. Get through all the rooms and out of the museum!</p>
    <p class="de">Du kommst nur weiter, wenn alles richtig ist. Jeder Fehler kostet Akku für deine Taschenlampe 🔦. Falsche Aufgaben kommen noch einmal.</p>`,
  goLabel: "🔦 Switch on your torch", time: "approx. 20 minutes", rulesLabel: "ARGUS rule card",
  get rules() { const S = JUEGO.S, k = S ? S.stage : 0;
    return k < 1 ? `<h2>📘 Rules</h2><p>You will discover the rules yourself in the first room! <span class="de">Die Regeln findest du gleich selbst heraus.</span></p>`
      : k < 4 ? `<h2>If clauses</h2>${IFH.RULES1}${IFH.RULESX}` : IFH.RULES; },
  stages: [
    { label: "Room 1 of 8", title: "🏛️ The Entrance Hall", go: "Read the sign →",
      intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>Intruder detected! … Oh, it's only a student. I am ARGUS, the security computer. All doors are locked until 7 am. I only open doors for visitors who understand my rules. Read the sign on the wall.</div></div>`,
      memo: SIGN, pista: "Schau dir die unterstrichenen Verben im Kasten an.", tasks: [
      Q("What do these sentences talk about?", ["Things that are possible and can really happen", "Things that happened yesterday", "Things that are impossible"], "These are real, possible situations. – Mögliche, realistische Situationen."),
      Q("Look at the <b>if-part</b>: <i>If you touch … · If a door is …</i> – which tense is it?", ["simple present", "simple past", "will-future"], "if-clause → simple present."),
      Q("Look at the <b>other part</b> (main clause): <i>the alarm will ring · you will break</i> – which form is it?", ["will / won't + infinitive", "simple present", "simple past"], "main clause → will + infinitive."),
      Q("Is this sentence correct? <i>“If you will touch the paintings, the alarm will ring.”</i>", ["No – there is never will in the if-clause.", "Yes, that's fine."], "Never <b>will</b> in the if-clause! – Im if-Satz steht nie will.", { noType: true }),
      Q("Look at the commas. When is there a comma?", ["When the if-clause comes first", "When the if-clause comes second", "Always"], "If-clause first → comma. – Steht der if-Satz vorn, kommt ein Komma.", { noType: true })] },
    { label: "Room 2 of 8", title: "🦖 The Dinosaur Hall",
      pick: { q: "Which way do you take to the Dinosaur Hall?", qDe: "Welchen Weg nimmst du?", intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>Door 1 is open. You can take the dark staircase or crawl through the air vent. Your choice!</div></div>`,
        opts: [{ t: "🪜 The dark staircase", intro: "<p>You walk down the old staircase. It creaks. Then you see it: a huge T. rex, and a door with a word lock right behind it.</p>", first: [2, 3] },
               { t: "🌀 The air vent", intro: "<p>You crawl through the dusty air vent and land right next to the T. rex's tail – and in front of a door with a word lock.</p>", first: [0, 4] }] },
      intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>This door has a word lock. Choose the combination that makes the sentence correct. Careful – the T. rex is watching you!</div></div>`,
      memo: "📌 Type I: if + <b>simple present</b>, main clause: <b>will / won't + verb</b>", tasks: [
      D("If you ___ the T. rex's tail, its eyes ___ red.", ["touch … will glow", "will touch … glow", "touched … will glow"], "if + simple present (touch), main clause will + verb (will glow)."),
      D("ARGUS ___ the door if you ___ the right code.", ["will open … enter", "opens … will enter", "would open … entered"], "Main clause first: will open · if-clause: enter."),
      D("If the night guard ___ you, he ___ your teacher.", ["finds … will call", "will find … calls", "find … would call"], "the guard (he) → finds · main clause → will call."),
      D("If you ___ the map, you ___ the exit.", ["don't read … won't find", "won't read … don't find", "doesn't read … wouldn't find"], "you → don't read · main clause → won't find."),
      D("If the lights ___ out, the emergency lamps ___ on.", ["go … will come", "will go … come", "goes … came"], "the lights (they) → go · main clause → will come.")] },
    { label: "Room 3 of 8", title: "⚱️ The Egyptian Room",
      intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>This door has a keyboard. Type the missing verbs. And use your torch – it's very dark in here!</div></div><p class="de">Schreibe die richtige Verbform. Kurzformen (won't, doesn't …) sind erlaubt.</p>`,
      memo: "📌 Type I: if + <b>simple present</b> (he/she/it → -s · don't/doesn't) · main clause: <b>will / won't + verb</b>", tasks: [
      F(1, "If you ___ at the mummy for a long time, you ___ a small cat on her necklace.", ["look", "see"], ["look", "will see|'ll see"]),
      F(1, "The alarm ___ if you ___ slowly.", ["not ring", "walk"], ["won't ring|will not ring", "walk"]),
      F(1, "If the guard ___ in here, he ___ you behind the statue.", ["come", "not see"], ["comes", "won't see|will not see"]),
      F(1, "If my phone battery ___, I ___ any light.", ["die", "not have"], ["dies", "won't have|will not have"])] },
    { label: "Room 4 of 8", title: "🖼️ The Painting Gallery", go: "Read the diary →",
      intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>This is Lady Ashworth's portrait. She opened this museum. Here is a page from her diary – she wrote it when she was 20. Read it carefully. Her sentences are different from mine!</div></div>`,
      memo: DIARY, pista: "Schau dir die unterstrichenen Verben im Tagebuch an.", tasks: [
      Q("Was Lady Ashworth a man? Did she have a sister?", ["No – she is imagining things that are not real.", "Yes – all these things were true."], "These sentences are about <b>unreal</b> situations – dreams and wishes. – Unwirkliche Situationen, Wünsche, Träume.", { noType: true }),
      Q("Look at the <b>if-part</b>: <i>If I had … · If my father listened …</i> – which tense is it?", ["simple past", "simple present", "will-future"], "if-clause → simple past."),
      Q("Is she writing about the past? (<i>If I had more money …</i>)", ["No – it's about her life now. The past form only shows: it's not real.", "Yes – it's about her past."], "Simple past here = unreal, not past time! – Die Vergangenheitsform zeigt hier: nicht wirklich.", { noType: true }),
      Q("Look at the <b>main clause</b>: <i>I would build … · he would let me …</i> – which form is it?", ["would / wouldn't + infinitive", "will + infinitive", "simple past"], "main clause → would + infinitive."),
      Q("<i>If I ___ a man …</i> – which form of <b>be</b> does Lady Ashworth use?", ["were", "am", "will be"], "If I / he / she / it <b>were</b> … (in spoken English, <i>was</i> is also used)."),
      Q("Which sentence sounds <b>less likely</b> – more like a dream?", ["If I had time, I would help you.", "If I have time, I will help you."], "Type II = unreal or very unlikely. Type I = possible.", { noType: true })] },
    { label: "Room 5 of 8", title: "🔐 The Treasure Vault",
      intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>The vault door needs a four-digit code. Lady Ashworth left four sentences with gaps. Every correct sentence shows you one digit.</div></div><p class="de">Typ II: if-Satz im simple past, Hauptsatz mit would. Jeder richtige Satz verrät eine Ziffer.</p>`,
      memo: "📌 Type II: if + <b>simple past</b> · main clause: <b>would / wouldn't + verb</b> · If I/he/she/it <b>were</b>", tasks: [
      F(2, "If I ___ the code, I ___ the vault.", ["know", "open"], ["knew", "would open|'d open"]),
      F(2, "If you ___ a thief, ARGUS ___ you.", ["be", "not help"], ["were|was", "wouldn't help|would not help"]),
      F(2, "If the vault ___ a window, we ___ the torch.", ["have", "not need"], ["had", "wouldn't need|would not need"]),
      F(2, "Lady Ashworth ___ proud if she ___ her museum today.", ["be", "see"], ["would be|'d be", "saw"])] },
    { label: "Room 6 of 8", title: "🕰️ The Hall of Clocks",
      intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>Code 1-8-7-8 – the year of Lady Ashworth's diary! Behind the vault is the Hall of Clocks. The clocks only stop if you build perfect sentences.</div></div>`,
      memo: "📌 If-clause first → comma · if-clause second → no comma", tasks: [
      { t: "order", task: "Put the words in the right order.", taskDe: "Wenn ich einen Schlüssel hätte, würde ich diese Tür öffnen.", words: ["If", "I", "had", "a", "key,", "I", "would", "open", "this", "door."], a: "If I had a key, I would open this door." },
      { t: "order", task: "Put the words in the right order.", taskDe: "Ich würde meine Mutter anrufen, wenn mein Handy Empfang hätte.", words: ["I", "would", "call", "my", "mum", "if", "my", "phone", "had", "a", "signal."], a: "I would call my mum if my phone had a signal." },
      { t: "order", task: "Put the words in the right order.", taskDe: "Wenn du die Uhren anhältst, öffnet sich der Ausgang.", words: ["If", "you", "stop", "the", "clocks,", "the", "exit", "will", "open."], a: "If you stop the clocks, the exit will open." }] },
    { label: "Room 7 of 8", title: "🚪 The Main Door",
      intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>Last test! I describe a situation. You choose the sentence that fits: real/possible (type I) or unreal (type II)?</div></div>`,
      memo: "📌 Real / possible → type I (present + will) · Unreal / not true → type II (past + would)", tasks: [
      SIT("You have a torch in your bag.", "If I need light, I will use my torch.", "If I needed light, I would use my torch.", "You really have a torch → type I.", "You really <b>have</b> a torch – it's possible. – Real → Typ I."),
      SIT("You don't have a key.", "If I had a key, I would open the door.", "If I have a key, I will open the door.", "No key → unreal → type II.", "You <b>don't</b> have a key. – Unwirklich → Typ II."),
      SIT("Maybe the night guard will come in the morning.", "If the guard comes, I will explain everything.", "If the guard came, I would explain everything.", "Maybe = possible → type I.", "<b>Maybe</b> → it's possible. – Möglich → Typ I."),
      SIT("You are not a superhero.", "If I were a superhero, I would fly out of the window.", "If I am a superhero, I will fly out of the window.", "Not a superhero → type II.", "You are <b>not</b> a superhero. – Unwirklich → Typ II."),
      SIT("Your teacher is probably looking for you.", "If my teacher calls, I will say sorry.", "If my teacher called, I would say sorry.", "Probably = possible → type I.", "It's quite <b>likely</b>. – Gut möglich → Typ I."),
      SIT("You can't read ancient Egyptian.", "If I could read ancient Egyptian, I would understand the hieroglyphs.", "If I can read ancient Egyptian, I will understand the hieroglyphs.", "You can't → unreal → type II.", "You <b>can't</b> read it. – Unwirklich → Typ II.")] },
    { label: "Exit", title: "⭐ ARGUS's report",
      intro: `<div class="who"><div class="face">🤖</div><div><b class="n">ARGUS</b>I have written a report about you for the night guard. But my grammar module is broken – there are three mistakes in it. Correct them, and I'll open the door!</div></div>`,
      memo: "📌 Never will/would in the if-clause · type I: present + will · type II: past + would", tasks: [
      ER(["If", "the", "student", "will press", "the", "green", "button,", "the", "door", "will", "open."], 3, "presses", ["presses", "pressed", "would press"], "No will in the if-clause: If the student presses …"),
      ER(["If", "the", "guard", "sees", "the", "student,", "he", "would be", "surprised."], 7, "will be", ["will be", "is", "was"], "sees (present) → type I → will be."),
      ER(["If", "I", "knew", "the", "phone", "number,", "I", "will call", "the", "parents."], 7, "would call", ["would call", "call", "called"], "knew (past) → type II → would call.")] }
  ],
  scene: (S) => { const k = S.stage, bat = (S.data && S.data.bat) || 100, ic = ["🏛️","🦖","⚱️","🖼️","🔐","🕰️","🚪","⭐"];
    const st = JUEGO.S && S.phase === "play" && k === 4 ? 4 - new Set(S.queue).size : (k > 4 ? 4 : 0);
    const x = 4 + k * 11.6, c = bat > 60 ? "#6fe39a" : bat > 30 ? "#e8b84a" : "#ff6b7a";
    return `<div class="hall"><div class="beam" style="left:calc(${x}% - 100px);opacity:${(bat / 100 * .8 + .2).toFixed(2)}"></div>
      <div class="rooms">${ic.map((e, i) => `<div class="rm ${i < k || S.done ? "ok" : i === k ? "now" : ""}">${e}</div>`).join("")}</div>
      <div class="me" style="left:calc(${x}% + 2px)">${E8.myAvatar()}</div></div>
      <div class="hud"><span class="bat">🔦 <span class="b"><i style="width:${bat}%;background:${c}"></i></span> ${bat}%</span>
      ${k >= 4 ? `<span class="code">${"1878".split("").map((d, i) => `<span>${i < st ? d : "?"}</span>`).join("")}</span>` : `<span>ROOM ${Math.min(k + 1, 8)} / 8</span>`}</div>`; },
  onMistake: S => { S.data.bat = Math.max(5, ((S.data && S.data.bat) || 100) - 4); },
  outro: `<div style="font-size:56px">🌙</div><h1>You escaped!</h1>
    <p>The main door opens. Outside, your teacher and the night guard are waiting with a hot chocolate. ARGUS says: “If you visit again, I will open all the doors for you!”</p>`
});
</script>
</body>
</html>
