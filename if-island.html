<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stranded · The Hirsch Games</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:radial-gradient(ellipse at 50% 0%,#0b5566 0%,#062a33 70%);--panel:#0a3440;--txt:#effaf8;--muted:#9fcfcc;--line:#2a6b78;--btn:#0d3f4c;--accent:#ffc94a;--accentTxt:#2a1e00;--accent2:#ffe3a0;--bubble:#0f4552;--input:#052029;--ok:#7dffb0;--bad:#ffb03a}
  .sea{position:relative;height:180px;overflow:hidden;border-radius:14px 14px 0 0;background:linear-gradient(#8fd8ff 0%,#c8eeff 55%,#2aa6c8 56%,#147a9a 100%)}
  .sea.night{background:linear-gradient(#0a1030 0%,#1a2050 55%,#0a3a5a 56%,#062a3a 100%)}
  .sun{position:absolute;left:30px;top:18px;width:46px;height:46px;border-radius:50%;background:#ffe25a;box-shadow:0 0 30px #ffe25a}
  .night .sun{background:#f4f1d0;box-shadow:0 0 20px #f4f1d0;width:34px;height:34px}
  .isl{position:absolute;left:50%;bottom:20px;width:260px;height:62px;margin-left:-130px;border-radius:50% 50% 40% 40%;background:#f3d58a}
  .palm{position:absolute;bottom:60px;font-size:56px}
  .me{position:absolute;bottom:62px;left:calc(50% - 50px);width:40px;height:40px;border-radius:50%;overflow:hidden;border:3px solid #ffc94a;background:#fff}
  .sam{position:absolute;bottom:60px;left:calc(50% + 6px);font-size:36px}
  .camp{position:absolute;bottom:60px;left:calc(50% + 50px);font-size:34px}
  .plane{position:absolute;top:24px;font-size:38px;animation:fly 6s linear infinite}
  @keyframes fly{from{left:110%}to{left:-15%}}
  .hud{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:14px;background:#052029;border-top:1px solid #2a6b78;flex-wrap:wrap}
  .m{display:flex;align-items:center;gap:5px}.m .b{width:80px;height:11px;border-radius:6px;background:#000;overflow:hidden}.m .b i{display:block;height:100%}
  .read{background:#f4e7c6;color:#3a2c18;border-radius:10px;padding:12px 16px;margin:10px 0;font-size:19px;line-height:1.6}
  .read .h{font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
</style>
</head>
<body>
<main id="app"></main>
<script src="game.js?v=13"></script>
<script src="juego.js?v=2"></script>
<script src="ifhelp.js?v=1"></script>
<script>
const F = IFH.F, SAM = {face:"🧑🏽", name:"Sam"};
const SAYS = `<div class="read"><div class="h">Sam says …</div>If we <u>find</u> fresh water, we <u>will survive</u>.<br>If we <u>had</u> a phone, we <u>would call</u> for help.<br>If it <u>rains</u> tonight, we <u>will collect</u> the water.<br>If we <u>were</u> at home now, we <u>would eat</u> pizza.</div>`;
const Q = (q, opts, why, extra) => Object.assign({ t: "choice", who: SAM, q: q, opts: opts, a: opts[0], after: why, hint: "Look at Sam's sentences again. – Schau dir Sams Sätze noch einmal an." }, extra || {});
const SIT = (sit, ok, no, why, hint) => ({ t: "choice", noType: true, task: "Choose the sentence that fits the situation.", taskDe: "Möglich (Typ I) oder unwirklich (Typ II)?", q: `<span class="small">SITUATION:</span> ${sit}`, opts: [ok, no], a: ok, after: why, hint: hint });
const ER = (words, bad, fix, opts, hint) => ({ t: "error", task: "Tap the wrong word and correct it.", taskDe: "Tippe das falsche Wort an und verbessere es.", words: words, bad: bad, fix: fix, opts: opts, hint: hint });
const RES = [["💧", "water"], ["🍌", "food"], ["⚡", "energy"]];

JUEGO.start({
  id: "if-island", key: "e10-if-island", icon: "🏝️", topic: "If clauses (type I + II)", title: "Stranded",
  intro: `<p>You and your friend <b>Sam</b> are on a sailing course on the west coast of Scotland. You are sailing a small boat with the group – but suddenly there is a storm. The wind pushes your boat far away from the others. The next morning, the boat is broken and you land on a <b>tiny island</b>.</p>
    <p>The sailing school is looking for you. Stay alive and help the rescue team find you!</p>
    <p class="de">Du kommst nur weiter, wenn alles richtig ist. Jeder Fehler kostet Wasser 💧, Essen 🍌 oder Energie ⚡. Falsche Aufgaben kommen noch einmal.</p>`,
  goLabel: "⛵ Set sail", time: "approx. 20 minutes", rulesLabel: "Survival guide",
  get rules() { const S = JUEGO.S; return !S || S.stage < 1 ? `<h2>📘 Rules</h2><p>You will discover the rules yourself on day 1! <span class="de">Die Regeln findest du gleich selbst heraus.</span></p>` : IFH.RULES; },
  stages: [
    { label: "Day 1 · Morning", title: "🏝️ Arrival", go: "Listen to Sam →",
      intro: `<div class="who"><div class="face">🧑🏽</div><div><b class="n">Sam</b>We made it to the beach! OK … no boat, no radio, and our phones are dead. Let's think. Listen to what I'm saying – some things are possible, some are just dreams.</div></div>`,
      memo: SAYS, pista: "Schau dir die unterstrichenen Verben in Sams Sätzen an.", tasks: [
      Q("Do Sam and you have a phone that works?", ["No – so “If we had a phone …” is a dream (unreal).", "Yes."], "They have no phone → the situation is <b>unreal</b>. – Unwirklich.", { noType: true }),
      Q("Can they maybe find water on the island?", ["Yes – that's possible, so: “If we find water, we will …”", "No, never."], "Finding water is <b>possible</b>. – Möglich.", { noType: true }),
      Q("Possible situations (<b>type I</b>): which tense is in the if-clause? (<i>If we find … · If it rains …</i>)", ["simple present", "simple past"], "Type I: if + simple present."),
      Q("Type I: what is in the main clause? (<i>we will survive</i>)", ["will + infinitive", "would + infinitive"], "Type I: will + infinitive."),
      Q("Unreal situations (<b>type II</b>): which tense is in the if-clause? (<i>If we had … · If we were …</i>)", ["simple past", "simple present"], "Type II: if + simple past."),
      Q("Type II: what is in the main clause? (<i>we would call</i>)", ["would + infinitive", "will + infinitive"], "Type II: would + infinitive."),
      Q("<i>If we were at home now …</i> – is this about the past?", ["No – it's about now. The past form only shows it's not real.", "Yes – it's about yesterday."], "Past form = unreal, not past time! – Vergangenheitsform = unwirklich.", { noType: true })] },
    { label: "Day 1 · Afternoon", title: "💡 Ideas on the beach",
      intro: `<div class="who"><div class="face">🧑🏽</div><div><b class="n">Sam</b>I've got lots of ideas! But some of them are real plans, and some are just dreams. Help me sort them.</div></div>`,
      memo: "📌 Type I (simple present + will) = possible plan · Type II (simple past + would) = dream", tasks: [
      { t: "sort", task: "Real plan or just a dream? Look at the verb forms.", taskDe: "Echter Plan (Typ I) oder Traum (Typ II)?", buckets: ["📋 Real plan (possible)", "💭 Just a dream (unreal)"],
        why: ["Look at the verbs: simple present + will → possible plan. – Achte auf die Verbformen.", "Look at the verbs: simple past + would → dream. – Achte auf die Verbformen."],
        items: [["If we build a hut, we will stay dry.", 0], ["If we had a helicopter, we would fly home.", 1], ["If we find coconuts, we will have food.", 0], ["If I were a fish, I would swim to the mainland.", 1],
                ["If we make a fire, the rescue plane will see the smoke.", 0], ["If the sailing school knew where we are, they would come at once.", 1], ["If the sun shines, our clothes will dry quickly.", 0], ["If we lived here, we would build a big house.", 1]],
        show: "Type I (present + will) = plan · Type II (past + would) = dream" }] },
    { label: "Day 2", title: "🛖 Building a camp",
      pick: { q: "Who goes to look for fresh water?", qDe: "Wer sucht nach Trinkwasser?", intro: `<div class="who"><div class="face">🧑🏽</div><div><b class="n">Sam</b>Good morning! We need water AND a camp today. One of us looks for water, the other one starts the camp.</div></div>`,
        opts: [{ t: "🧭 I go – Sam builds the camp.", intro: "<p>You find a little stream behind the rocks! When you come back, Sam has already collected some wood.</p>", first: [0, 3] },
               { t: "🛖 Sam goes – I build the camp.", intro: "<p>You build the frame of a hut. An hour later, Sam comes back with a bottle of fresh water from a stream. Great!</p>", first: [2, 4] }] },
      intro: `<div class="who"><div class="face">🧑🏽</div><div><b class="n">Sam</b>We're making real plans now – these things can really happen. So we need type I!</div></div><p class="de">Schreibe die richtige Verbform. Kurzformen (won't, doesn't …) sind erlaubt.</p>`,
      memo: "📌 Type I: if + <b>simple present</b> (he/she/it → -s · don't/doesn't) · main clause: <b>will / won't + verb</b>", tasks: [
      F(1, "If we ___ wood now, we ___ a fire tonight.", ["collect", "have"], ["collect", "will have|'ll have"]),
      F(1, "If the fire ___, we ___ cold.", ["not burn", "be"], ["doesn't burn|does not burn", "will be|'ll be"]),
      F(1, "If I ___ that palm tree, I ___ some coconuts.", ["climb", "get"], ["climb", "will get|'ll get"]),
      F(1, "If it ___ tonight, the hut ___ us dry.", ["rain", "keep"], ["rains", "will keep"]),
      F(1, "We ___ lost if we ___ near the beach.", ["not get", "stay"], ["won't get|will not get", "stay"])] },
    { label: "Day 2 · Night", title: "🔥 Campfire dreams",
      intro: `<div class="who"><div class="face">🧑🏽</div><div><b class="n">Sam</b>It's dark now. Let's talk about things we don't have and places where we aren't – just dreams. So that's type II!</div></div>`,
      memo: "📌 Type II: if + <b>simple past</b> · main clause: <b>would / wouldn't + verb</b> · If I/he/she <b>were</b> · can → <b>could</b>", tasks: [
      F(2, "If we ___ marshmallows, we ___ them over the fire.", ["have", "roast"], ["had", "would roast|'d roast"]),
      F(2, "Sam: “If I ___ at home now, I ___ in my warm bed.”", ["be", "sleep"], ["were|was", "would sleep|'d sleep"]),
      F(2, "If my parents ___ us now, they ___ it!", ["see", "not believe"], ["saw", "wouldn't believe|would not believe"]),
      F(2, "I ___ scared if Sam ___ here with me.", ["be", "not be"], ["would be|'d be", "weren't|wasn't|were not|was not"]),
      F(2, "If you ___ have one thing from home, what ___?", ["can", "you / take"], ["could", "would you take"])] },
    { label: "Day 3", title: "🧭 Real or dream?",
      intro: `<div class="who"><div class="face">🧑🏽</div><div><b class="n">Sam</b>Here's the situation this morning. Every time, you have to decide: Is it possible – or not real at all?</div></div>`,
      memo: "📌 Real / possible → type I · Not true / unreal → type II", tasks: [
      SIT("Sam has a small mirror in his bag.", "If a plane comes, we will use the mirror to send a signal.", "If a plane came, we would use the mirror to send a signal.", "Sam really has a mirror and a plane may come → type I.", "Sam really <b>has</b> a mirror – it's possible. – Möglich → Typ I."),
      SIT("You don't have a boat.", "If we had a boat, we would sail home.", "If we have a boat, we will sail home.", "No boat → unreal → type II.", "You <b>don't</b> have a boat. – Unwirklich → Typ II."),
      SIT("Maybe it will be sunny tomorrow.", "If it is sunny tomorrow, the plane will see our smoke.", "If it was sunny tomorrow, the plane would see our smoke.", "Maybe → possible → type I.", "<b>Maybe</b> = it's possible. – Möglich → Typ I."),
      SIT("Sam can't swim very well.", "If Sam could swim better, we would try to reach the next island.", "If Sam can swim better, we will try to reach the next island.", "He can't → unreal → type II.", "Sam <b>can't</b> swim well. – Unwirklich → Typ II."),
      SIT("There are fish in the lagoon.", "If we catch a fish, we will cook it on the fire.", "If we caught a fish, we would cook it on the fire.", "Catching a fish is possible → type I.", "There <b>are</b> fish. – Möglich → Typ I.")] },
    { label: "Day 4", title: "🍾 Message in a bottle",
      intro: `<div class="who"><div class="face">🧑🏽</div><div><b class="n">Sam</b>Let's write three sentences on the paper and throw the bottle into the sea. Every word must be right!</div></div>`,
      memo: "📌 If-clause first → comma · if-clause second → no comma", tasks: [
      { t: "order", task: "Put the words in the right order.", taskDe: "Wenn du diese Flasche findest, rettest du zwei Leben.", words: ["If", "you", "find", "this", "bottle,", "you", "will", "save", "two", "lives."], a: "If you find this bottle, you will save two lives." },
      { t: "order", task: "Put the words in the right order.", taskDe: "Wir wären sehr froh, wenn ihr schnell kämt.", words: ["We", "would", "be", "very", "happy", "if", "you", "came", "quickly."], a: "We would be very happy if you came quickly." },
      { t: "order", task: "Put the words in the right order.", taskDe: "Wenn das Wetter gut bleibt, warten wir am Strand.", words: ["If", "the", "weather", "stays", "good,", "we", "will", "wait", "on", "the", "beach."], a: "If the weather stays good, we will wait on the beach." }] },
    { label: "Day 4 · Rescue", title: "🛩️ Sam's diary",
      intro: `<div class="who"><div class="face">🧑🏽</div><div><b class="n">Sam</b>Can you hear that? An engine! A plane! Quick – before it lands, check my diary. I think I made three mistakes.</div></div>`,
      memo: "📌 Never will/would in the if-clause · type I: present + will · type II: past + would", tasks: [
      ER(["If", "the", "plane", "will see", "the", "smoke,", "it", "will", "land."], 3, "sees", ["sees", "saw", "would see"], "No will in the if-clause: If the plane sees …"),
      ER(["If", "I", "were", "a", "bird,", "I", "will fly", "home."], 6, "would fly", ["would fly", "fly", "flew"], "were (unreal) → type II → would fly."),
      ER(["If", "it", "rained", "tonight,", "we", "will", "collect", "water."], 2, "rains", ["rains", "will rain", "rain"], "will collect → type I → If it rains …")] }
  ],
  scene: (S) => { const d = S.data || {}, k = S.stage, night = k === 3, rescue = k === 6 || S.done;
    return `<div class="sea ${night ? "night" : ""}"><div class="sun"></div>${rescue ? `<div class="plane">🛩️</div>` : ""}<div class="isl"></div><div class="palm" style="left:calc(50% - 120px)">🌴</div>
      <div class="me">${E8.myAvatar()}</div><div class="sam">🧑🏽</div>${k >= 3 ? `<div class="camp">${night ? "🔥" : "🛖"}</div>` : ""}</div>
      <div class="hud">${RES.map(([ic, n]) => { const v = d[n] === undefined ? 100 : d[n], c = v > 60 ? "#7dffb0" : v > 30 ? "#ffc94a" : "#ff7a6b";
        return `<span class="m">${ic}<span class="b"><i style="width:${v}%;background:${c}"></i></span></span>`; }).join("")}<span>${["DAY 1", "DAY 1", "DAY 2", "NIGHT 2", "DAY 3", "DAY 4", "DAY 4"][Math.min(k, 6)]}</span></div>`; },
  onMistake: S => { const n = RES[(S.data.rot || 0) % 3][1]; S.data[n] = Math.max(5, (S.data[n] === undefined ? 100 : S.data[n]) - 5); S.data.rot = (S.data.rot || 0) + 1; },
  outro: `<div style="font-size:56px">🛩️🏝️</div><h1>Rescued!</h1>
    <p>A seaplane of the coast guard lands in the lagoon. The pilot smiles: “We saw your smoke from far away! If you go sailing again, take a waterproof phone!”</p>`
});
</script>
</body>
</html>
